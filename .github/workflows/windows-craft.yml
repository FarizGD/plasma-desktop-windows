name: Windows (Craft)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Craft packages to build, space separated"
        default: "libplasma plasma-workspace"
        type: string
  push:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "WINDOWS_PORT.md"
      - ".github/workflows/windows-craft.yml"

concurrency:
  group: windows-craft-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CRAFT_ROOT: C:\\CraftRoot
  # KDE Craft currently publishes its bootstrap from the master branch.
  # Release-number branch names such as 26.04 are not present in the repository.
  CRAFT_BRANCH: "master"

jobs:
  craft:
    name: Craft dependency reconnaissance
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Enable Developer Mode
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Bootstrap Craft
        shell: pwsh
        run: |
          python -m pip install --upgrade certifi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest "https://raw.githubusercontent.com/KDE/craft/$env:CRAFT_BRANCH/setup/CraftBootstrap.py" -OutFile CraftBootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Upstream currently defaults gettext to 1.0, whose MSVC build links
          # libtextstyle and fails with unresolved iconv_ostream_create. Version
          # 0.22.3 already carries Craft's MSVC-compatible no-libtextstyle patch.
          Invoke-WebRequest "https://invent.kde.org/packaging/craft/-/archive/$env:CRAFT_BRANCH/craft-$env:CRAFT_BRANCH.zip" -OutFile craft-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -Path craft-source.zip -DestinationPath craft-source -Force
          $craftSource = Get-ChildItem "craft-source" -Directory | Select-Object -First 1 -ExpandProperty FullName
          if (-not $craftSource) { throw "Craft source archive did not contain a source directory." }

          $gettextBlueprint = Join-Path $craftSource "blueprints/libs/gettext/gettext.py"
          if (-not (Test-Path $gettextBlueprint)) { throw "Could not find the gettext Craft blueprint: $gettextBlueprint" }
          $blueprintText = Get-Content $gettextBlueprint -Raw
          if (-not $blueprintText.Contains('self.defaultTarget = "1.0"')) {
            throw "Unexpected gettext blueprint; refusing to apply an unverified version override."
          }
          $blueprintText = $blueprintText.Replace('self.defaultTarget = "1.0"', 'self.defaultTarget = "0.22.3"')
          Set-Content -Path $gettextBlueprint -Value $blueprintText -NoNewline -Encoding utf8

          python CraftBootstrap.py --branch $env:CRAFT_BRANCH --localDev $craftSource --prefix $env:CRAFT_ROOT --use-defaults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Discover Craft commands and blueprints
        shell: pwsh
        continue-on-error: true
        run: |
          . "$env:CRAFT_ROOT\craft\craftenv.ps1"
          craft --help
          craft --search libplasma
          craft --search plasma-workspace

      - name: Build selected targets
        shell: pwsh
        continue-on-error: true
        env:
          TARGETS: ${{ inputs.targets || 'libplasma plasma-workspace' }}
        run: |
          . "$env:CRAFT_ROOT\craft\craftenv.ps1"
          $targets = $env:TARGETS.Split(" ", [StringSplitOptions]::RemoveEmptyEntries)
          $results = @()
          foreach ($target in $targets) {
            Write-Host "::group::craft $target"
            craft $target
            $results += [pscustomobject]@{ Target = $target; ExitCode = $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
          "## Craft build results" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($result in $results) {
            $status = if ($result.ExitCode -eq 0) { "ok" } else { "FAILED (exit $($result.ExitCode))" }
            "- $($result.Target): $status" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if ($results | Where-Object { $_.ExitCode -ne 0 }) { exit 1 }

      - name: Collect Craft logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force craft-logs | Out-Null
          Copy-Item "$env:USERPROFILE\.craft\*" craft-logs -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$env:CRAFT_ROOT\etc\CraftSettings.ini" craft-logs -ErrorAction SilentlyContinue
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-logs
          path: craft-logs
          if-no-files-found: ignore
